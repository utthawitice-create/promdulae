<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EEF2F1">
<title>พร้อมดูแล — โปรแกรมเสริมความมั่นใจญาติผู้ดูแลผู้ป่วยโรคหลอดเลือดสมอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --card:#FFFFFF; --ink:#17332E; --ink2:#46605A; --mute:#7A8C88; --line:#DCE5E2; --line2:#E9EFED;
  --pri:#0E6B5C; --pri2:#128070; --priDeep:#0A4F45; --priSoft:#E1F0EC;
  --mari:#F2B33D; --mariDeep:#A86F00; --mariSoft:#FDF1D8;
  --acc:#B85C14; --accSoft:#FBEBDD;
  --ok:#1E7A45; --okSoft:#E2F3E8; --warn:#C62E22; --warnSoft:#FCE9E7; --gold:#A86F00; --goldSoft:#FDF1D8;
  --fs:17px; --rL:22px; --rM:16px; --rS:11px;
  --display:"Mitr","IBM Plex Sans Thai Looped",sans-serif;
  --body:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Leelawadee UI",Tahoma,sans-serif;
  --lc:var(--pri); --ls:var(--priSoft);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);font-size:var(--fs);line-height:1.65;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.big{--fs:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:104px;position:relative}
h1,h2,.display{font-family:var(--display);font-weight:500;letter-spacing:0}
h1{font-size:1.55em;line-height:1.3;margin:12px 0 6px}
h2{font-size:1.15em;line-height:1.35;margin:28px 0 12px}
h3{font-size:1.02em;line-height:1.45;margin:0 0 6px;font-weight:600}
p{margin:0 0 10px}
.mute{color:var(--mute)} .ink2{color:var(--ink2)} .small{font-size:.86em}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px;border-radius:6px}

/* app bar */
header.top{position:sticky;top:0;z-index:20;background:rgba(238,242,241,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:10px 16px;display:flex;align-items:center;gap:8px;min-height:62px}
header.top.scrolled{box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.brand .bt{font-family:var(--display);font-weight:500;font-size:1.12em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:13px;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink2);flex:none;box-shadow:0 0 0 1px var(--line)}
.iconbtn:active{transform:scale(.95)}
main{padding:4px 16px 24px}

/* surfaces */
.card{background:var(--card);border-radius:var(--rM);padding:18px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line2)}
.card.flat{background:transparent;box-shadow:0 0 0 1.5px var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:.78em;font-weight:600;background:var(--priSoft);color:var(--pri)}
.pill.acc{background:var(--accSoft);color:var(--acc)} .pill.ok{background:var(--okSoft);color:var(--ok)} .pill.warn{background:var(--warnSoft);color:var(--warn)} .pill.gold{background:var(--mariSoft);color:var(--mariDeep)} .pill.gray{background:#E8EEEC;color:var(--ink2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:600;background:var(--pri);color:#fff;min-height:52px;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--priDeep)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
.btn.soft{background:var(--priSoft);color:var(--pri)}
.btn.warn{background:var(--warn)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:.9em;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* forms */
input[type=text],input[type=tel],input[type=date],input[type=password],input[type=number],input[type=url],input[type=datetime-local],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;min-height:50px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 4px var(--priSoft)}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:.92em}
.hint{font-size:.82em;color:var(--mute);margin-top:5px;line-height:1.5}

/* bottom nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 -1px 0 var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72em;font-weight:600;color:var(--mute)}
nav.bottom .ni{width:56px;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.bottom button.on{color:var(--pri)}
nav.bottom button.on .ni{background:var(--priSoft)}
nav.bottom button.sos{color:var(--warn)}
nav.bottom button.sos.on .ni{background:var(--warnSoft)}

/* home: greeting + journey */
.greet{margin:6px 0 16px}
.greet h1{margin:0;font-size:1.6em}
.greet p{margin:2px 0 0;color:var(--ink2)}
.journey{background:var(--priDeep);color:#fff;border-radius:var(--rL);padding:20px 18px 18px;position:relative;overflow:hidden}
.journey .jt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.journey .jt b{font-family:var(--display);font-weight:500;font-size:1.25em}
.journey .jt span{font-size:.84em;opacity:.8}
.track{position:relative;margin:26px 6px 8px;height:6px;border-radius:6px;background:rgba(255,255,255,.18)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--mari)}
.track .you{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--mari);box-shadow:0 0 0 5px rgba(242,179,61,.3)}
.stops{display:grid;grid-template-columns:1fr 2fr 1fr;font-size:.8em;margin-top:12px}
.stops div{display:flex;flex-direction:column;gap:2px;opacity:.7}
.stops div.now{opacity:1;font-weight:600}
.stops div:nth-child(2){align-items:center;text-align:center}
.stops div:nth-child(3){align-items:flex-end;text-align:right}
.stops small{font-size:.92em;opacity:.85;font-weight:400}
.cheer{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:.95em;line-height:1.6;opacity:.95}
.next{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--rM);padding:16px;margin-top:12px;box-shadow:0 0 0 1px var(--line2),0 8px 24px -14px rgba(14,107,92,.45);border:0;width:100%;text-align:left}
.next .nb{width:48px;height:48px;border-radius:15px;background:var(--mariSoft);color:var(--mariDeep);display:grid;place-items:center;flex:none}
.next .nt{font-size:.78em;font-weight:600;color:var(--mariDeep)}
.next b{display:block;line-height:1.4}
.next .go{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.quick button{background:var(--card);border:0;border-radius:var(--rM);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82em;font-weight:600;color:var(--ink);box-shadow:0 0 0 1px var(--line2);line-height:1.3;text-align:center}
.quick .qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}

/* lesson shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.book{position:relative;border:0;padding:0;text-align:left;border-radius:var(--rM);background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line2),0 10px 22px -16px rgba(23,51,46,.55);transition:transform .15s}
.book:active{transform:scale(.97)}
.book img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:var(--ls,#E3EAE8)}
.book .bp{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:.76em;font-weight:600;color:var(--ink2);background:#fff}
.book .bp i{flex:1;height:6px;border-radius:6px;background:#E3EAE8;position:relative;overflow:hidden}
.book .bp i:after{content:"";position:absolute;inset:0;width:var(--p);background:var(--mari);border-radius:6px}
.book.done .bp{color:var(--ok)}
.book.done .bp svg{color:var(--ok)}

/* lesson list (บทเรียน) */
.les{display:flex;gap:14px;align-items:stretch;background:var(--card);border-radius:var(--rM);padding:0;margin-bottom:10px;border:0;width:100%;text-align:left;box-shadow:0 0 0 1px var(--line2);overflow:hidden}
.les .lcov{width:92px;flex:none;background:var(--lc);display:flex;align-items:center}
.les .lcov img{display:block;width:100%;height:auto;aspect-ratio:2/3}
.les{align-items:stretch}
.les .ln{width:64px;flex:none;background:var(--lc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-size:1.7em;line-height:1}
.les .lb{padding:14px 14px 14px 0;flex:1;min-width:0}
.les .no{font-size:.76em;color:var(--mute);font-weight:600}
.bar{height:7px;border-radius:9px;background:#E3EAE8;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mari);border-radius:9px;transition:width .4s}
/* old helpers kept for other views */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:var(--rM);box-shadow:0 0 0 1px var(--line2);padding:16px;border:0;text-align:left;display:flex;flex-direction:column;gap:8px}

/* lesson hero */
.lhero{margin:0 -16px;padding:18px 20px 30px;background:var(--lc);color:#fff;position:relative;overflow:hidden}
.lhero .ln{font-family:var(--display);font-size:5em;line-height:1;font-weight:500;opacity:.2;position:absolute;right:18px;top:4px}
.lhero .lk{font-size:.82em;font-weight:600;opacity:.85}
.lhero h1{color:#fff;margin:2px 0 12px;font-size:1.42em;max-width:88%}
.lhero .chips{display:flex;gap:8px;flex-wrap:wrap}
.lhero .chips span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 11px;font-size:.78em;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);padding:5px;border-radius:15px;margin:-14px 0 18px;position:sticky;top:66px;z-index:10;box-shadow:0 0 0 1px var(--line2),0 8px 20px -12px rgba(23,51,46,.35)}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:11px;font-weight:600;font-size:.84em;color:var(--ink2);line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{opacity:.7}
.tabs button.on{background:var(--ls);color:var(--lc)}
.tabs button.on svg{opacity:1}
.src{display:none;gap:6px;align-items:center;font-size:.76em;font-weight:600;color:var(--ink2);background:#E6ECEA;padding:3px 10px;border-radius:99px;margin-bottom:12px}
body.res .src{display:inline-flex}
.sect{font-family:var(--display);font-weight:500;font-size:1.08em;margin:22px 0 10px}

/* steps */
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.step:first-child{padding-top:2px}
.step:last-child{border-bottom:0;padding-bottom:0}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--lc);color:#fff;font-family:var(--display);font-weight:500;display:grid;place-items:center;flex:none;margin-top:1px}
.dont{background:var(--warnSoft);border-radius:var(--rM);padding:14px 16px;margin-top:12px}
.dont li{margin:4px 0}
.why{background:var(--ls);border-radius:var(--rM);padding:14px 16px}
.why b{color:var(--lc)}
ul.clean{margin:0;padding-left:20px}
ul.clean li{margin:3px 0}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;border-radius:var(--rM);margin-bottom:10px;background:#fff;width:100%;text-align:left;box-shadow:0 0 0 1.5px var(--line)}
.chk .box{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 2px #B9C8C4;flex:none;display:grid;place-items:center;color:#fff;transition:.2s}
.chk.on{box-shadow:0 0 0 1.5px #B5DCC4;background:#F5FBF7}
.chk.on .box{background:var(--ok);box-shadow:none}
.chk .meta{font-size:.78em;color:var(--mute);margin-top:3px;display:block}
.verify{font-size:.76em;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--mariSoft);color:var(--mariDeep)}

/* confidence slider */
.conf{padding:6px 0 4px}
.conf .val{font-family:var(--display);font-size:3em;font-weight:500;color:var(--lc);text-align:center;line-height:1}
.conf .lab{text-align:center;color:var(--ink2);font-weight:600;margin:6px 0 12px;min-height:1.5em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--lc) var(--v,50%),#DCE5E2 var(--v,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--lc);box-shadow:0 2px 8px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--lc)}
.scale{display:flex;justify-content:space-between;font-size:.78em;color:var(--mute);margin-top:8px}

/* SE items */
.seq{padding:14px 0;border-bottom:1px solid var(--line2)}
.seq:last-child{border-bottom:0}
.seq .q{font-weight:500;margin-bottom:8px}
.nums{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.nums button{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;border-radius:9px;padding:8px 0;font-weight:600;font-size:.86em;min-height:42px}
.nums button.on{background:var(--pri);box-shadow:none;color:#fff}

/* breathing */
.breath{display:grid;place-items:center;padding:20px 0 6px}
.orb{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;position:relative}
.orb .c{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FCFC2,#0E6B5C);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 14px 40px rgba(14,107,92,.35)}
.orb .r{position:absolute;inset:-10px;border-radius:50%;border:2px dashed #B8D8D1}
.orb .t{position:relative;color:#fff;font-family:var(--display);font-weight:500;font-size:1.3em;text-align:center;line-height:1.3}
.orb .t small{display:block;font-size:.62em;font-weight:400;opacity:.9}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74em;font-weight:600;color:var(--ink2);line-height:1.3}
.moods button.on{box-shadow:inset 0 0 0 2px var(--pri);background:var(--priSoft);color:var(--pri)}
.moods svg{width:30px;height:30px}

/* SOS */
.sos-hero{background:var(--warn);color:#fff;border-radius:var(--rL);padding:20px}
.sos-hero h1{color:#fff}
.call{display:flex;align-items:center;gap:14px;background:#fff;color:var(--warn);border-radius:var(--rM);padding:14px 16px;text-decoration:none;font-weight:700;margin-top:14px}
.call .num{font-family:var(--display);font-size:1.9em;line-height:1;font-weight:500}
.fast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.fast div{background:var(--card);box-shadow:0 0 0 1px var(--line2);border-radius:14px;padding:10px 8px;text-align:center}
.fast b{display:block;font-family:var(--display);font-weight:500;font-size:1.6em;color:var(--warn);line-height:1.1}
.fast span{font-size:.76em;color:var(--ink2);line-height:1.35;display:block;margin-top:3px}
.sign{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.sign:last-child{border-bottom:0}
.sign .si{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

/* timeline (plan) */
.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:2px 0 18px}
.tl .st:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-30px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:.7em;font-weight:700;color:var(--mute)}
.tl .st.now .dot{background:var(--mari);box-shadow:0 0 0 5px var(--mariSoft);color:var(--ink)}
.tl .st.done .dot{background:var(--ok);box-shadow:none;color:#fff}
.tl .st b{display:block}

/* chart & tables */
.chart svg{width:100%;height:auto;display:block}
table.t{width:100%;border-collapse:collapse;font-size:.84em}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--ink2);background:#F5F8F7;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;box-shadow:0 0 0 1px var(--line);border-radius:14px;background:#fff}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,32,29,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#C9D5D2;margin:-6px auto 14px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:80;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:fade .25s;max-width:90vw;text-align:center}
.celebrate{text-align:center;padding:10px 0}
.celebrate .badge{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:var(--mariSoft);display:grid;place-items:center;color:var(--mariDeep);animation:pop .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
.lgtop{background:var(--priDeep);color:#fff;border-radius:var(--rL);padding:26px 22px 24px;margin-bottom:14px;position:relative;overflow:hidden}
.lgtop h1{color:#fff;font-size:2em;margin:14px 0 4px}
.lgtop p{opacity:.85;margin:0}
.lgtop .ring6{display:flex;gap:6px;margin-top:18px}
.lgtop .ring6 i{width:22px;height:8px;border-radius:8px;opacity:.95}
.logo{width:60px;height:60px;border-radius:18px;background:var(--mari);display:grid;place-items:center;color:var(--priDeep)}
.seg{display:flex;background:#E3EAE8;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--pri)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9em;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;box-shadow:0 0 0 1px var(--line2);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:1.5em;line-height:1.1;color:var(--pri);font-variant-numeric:tabular-nums}
.stat span{font-size:.76em;color:var(--mute);line-height:1.35;display:block;margin-top:4px}
.res-banner{background:var(--ink);color:#fff;font-size:.82em;padding:7px 16px;display:flex;justify-content:space-between;align-items:center}
.res-banner button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:.95em}
code.blk{display:block;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:10px;font-size:.72em;word-break:break-all;max-height:120px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.divider{height:1px;background:var(--line);margin:16px 0}

/* video */
.player{background:#0F2622;border-radius:var(--rM);color:#fff;overflow:hidden}
.player video{width:100%;display:block;max-height:360px;background:#000}
.vcard{background:var(--card);border-radius:var(--rM);overflow:hidden;margin-bottom:12px;box-shadow:0 0 0 1px var(--line2)}
.ytbox{position:relative;padding-top:56.25%;background:#0F2622}
.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytface{position:absolute;inset:0;border:0;width:100%;background:linear-gradient(160deg,var(--lc),#0F2622 85%);color:#fff;display:grid;place-items:center}
.ytplay{width:68px;height:48px;border-radius:14px;background:#E0291B;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ytn{position:absolute;left:14px;top:12px;font-size:.78em;font-weight:600;opacity:.9}
.ytopen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;text-decoration:none;padding:16px;text-align:left;font-size:.92em;background:#0F2622}
.ytopen svg{color:var(--mari);flex:none}
.ytmeta{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ytmeta b{line-height:1.45}
.ytmeta span{font-size:.8em;color:var(--mute)}
.ytmeta a{color:var(--pri);font-weight:600}

/* infographic */
.infobtn{display:block;width:100%;padding:0;border:0;background:#fff;border-radius:var(--rM);overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 12px 28px -18px rgba(23,51,46,.5);position:relative}
.infobtn img{display:block;width:100%;height:auto;aspect-ratio:2/3}
.zoomhint{display:flex;justify-content:center;gap:6px;align-items:center;padding:10px;font-size:.84em;font-weight:600;color:var(--lc);border-top:1px solid var(--line2)}
.viewer{position:fixed;inset:0;z-index:90;background:#0B1714;display:flex;flex-direction:column;animation:fade .2s}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;background:rgba(0,0,0,.35)}
.vbar button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.3em;font-weight:600}
.vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.vscroll img{display:block;width:100%;max-width:none;margin:0 auto;transition:width .2s}
@media (min-width:700px){.vscroll img{width:min(100%,720px)}}
@media (min-width:600px){main{padding:4px 20px 24px}.lhero{margin:0 -20px;border-radius:0 0 var(--rL) var(--rL)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- state ---------- */
function blank(){return{v:1,pid:'',group:'E',startDate:today(),dischargeDate:'',created:nowISO(),
 lessons:{},se:[],mood:[],breath:[],questions:[],logs:[],acts:{},followups:[],care:{},
 settings:{videos:{},phone:'',ward:'หอผู้ป่วยวิกฤตโรคหลอดเลือดสมอง โรงพยาบาลนครพิงค์',pin:'',sheetUrl:'',big:false,tts:true}}}
let S; try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S)S=blank();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}; queueSync()};
const log=(type,ref='')=>{S.logs.push({t:nowISO(),type,ref});if(S.logs.length>3000)S.logs=S.logs.slice(-3000);save()};
const L=id=>S.lessons[id]||(S.lessons[id]={views:0,played:0,check:{},conf:[]});
let researcher=false, route='home', tab='steps';

/* ---------- derived ---------- */
function dayNo(){const s=new Date(S.startDate);const d=Math.floor((new Date(today())-s)/864e5)+1;return Math.max(1,d)}
function weekNo(){return Math.min(4,Math.ceil(dayNo()/7))}
function phaseNo(){const w=weekNo();return w===1?1:w<4?2:3}
function lessonPct(id){const les=LESSONS.find(x=>x.id===id),st=L(id);const n=les.checklist.length;const done=les.checklist.filter(c=>st.check[c.id]?.done).length;return{done,n,pct:Math.round(done/n*100)}}
function overall(){let d=0,n=0;LESSONS.forEach(l=>{const p=lessonPct(l.id);d+=p.done;n+=p.n});return{d,n,pct:Math.round(d/n*100)}}
function lastConf(id){const c=L(id).conf;return c.length?c[c.length-1].v:null}
function seMean(rec){return rec?mean(rec.scores.filter(v=>v!=null)):null}
function seBy(phase){const r=S.se.filter(x=>x.phase===phase);return r.length?r[r.length-1]:null}
function suggestPhase(){if(!seBy('base'))return 'base';const w=weekNo();if(w>=4)return 'post';if(w===1)return 'w1';return 'w'+w}

/* ---------- sync (Google Apps Script) — ทำงานเมื่อโฮสต์เอง; ใน claude.ai จะถูกบล็อกโดยปลอดภัย ---------- */
let syncT=null;
function queueSync(){if(!S.settings.sheetUrl||!S.pid)return;clearTimeout(syncT);syncT=setTimeout(doSync,4000)}
async function doSync(manual){if(!S.settings.sheetUrl)return manual&&toast('ยังไม่ได้ตั้งค่า URL ของ Google Apps Script');
 try{await fetch(S.settings.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(packet())});S.lastSync=nowISO();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};manual&&toast('ส่งข้อมูลแล้ว')}
 catch(e){manual&&toast('ส่งไม่สำเร็จ ข้อมูลยังเก็บอยู่ในเครื่อง ลองอีกครั้งเมื่อมีสัญญาณ')}}
function packet(){const o=JSON.parse(JSON.stringify(S));delete o.settings.pin;delete o.settings.sheetUrl;o.summary=summary(S);return o}
function summary(s){
 const keep=S; S=s; // compute with given state
 const r={pid:s.pid,group:s.group,start:s.startDate,discharge:s.dischargeDate,
  seBase:f2(seMean(seBy('base'))),sePost:f2(seMean(seBy('post'))),
  checklistPct:overall().pct,lessonViews:LESSONS.reduce((a,l)=>a+(s.lessons[l.id]?.views||0),0),
  videoPlays:LESSONS.reduce((a,l)=>a+(s.lessons[l.id]?.played||0),0),
  appDays:new Set((s.logs||[]).map(x=>x.t.slice(0,10))).size,
  homeDays:new Set((s.logs||[]).filter(x=>s.dischargeDate&&x.t.slice(0,10)>s.dischargeDate).map(x=>x.t.slice(0,10))).size,
  breath:(s.breath||[]).length,acts:ACTS.filter(a=>s.acts?.[a.id]?.done).length,followups:(s.followups||[]).length};
 S=keep; return r}

/* ---------- toast / modal ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html,onMount){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);onMount&&onMount(m);return m}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('คัดลอกแล้ว')}catch(e){toast('คัดลอกไม่ได้ กรุณากดค้างที่ข้อความเพื่อคัดลอกเอง')}}
function speak(t){if(!S.settings.tts||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}

function miniChart(pts,max){if(!pts.length)return '';const W=320,H=120,px=26,py=14;const n=pts.length;

 return `<div class="chart"><svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="กราฟความมั่นใจ">

  <path d="${path}" fill="none" stroke="#0f5c55" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,k)=>`<circle cx="${x(k)}" cy="${y(p.v)}" r="4.5" fill="#fff" stroke="#0f5c55" stroke-width="2.5"/><text x="${x(k)}" y="${y(p.v)-9}" text-anchor="middle" font-size="11" font-weight="600" fill="#1d2733">${+(+p.v).toFixed(1)}</text><text x="${x(k)}" y="${H+14}" text-anchor="middle" font-size="9.5" fill="#7b8592">${esc(p.lab||thDate(p.d))}</text>`).join('')}

function runBreath(){const c=$('#orbc'),t=$('#orbt'),b=$('#bBtn');if(!c)return;
 const seq=[['หายใจเข้า',4000,1],['กลั้นไว้',4000,1],['หายใจออกช้า ๆ',6000,.55]];let k=0;breathN=0;
 const stepF=()=>{if(!breathOn)return;const [lab,ms,sc]=seq[k];c.style.transition=`transform ${ms}ms ease-in-out`;c.style.transform=`scale(${sc})`;
  let s=ms/1000;t.innerHTML=`${lab}<small>${s}</small>`;const cd=setInterval(()=>{s--;if(s>0&&breathOn)t.innerHTML=`${lab}<small>${s}</small>`;else clearInterval(cd)},1000);
  breathT=setTimeout(()=>{k=(k+1)%3;if(k===0){breathN++;if(breathN>=5){breathOn=false;S.breath.push(nowISO());log('breath');save();t.innerHTML='ทำได้ดีมาก<small>รู้สึกสบายขึ้นไหม</small>';c.style.transform='scale(.55)';b.innerHTML=I('refresh',18)+' ฝึกอีกครั้ง';return}}stepF()},ms)};
 stepF()}

 <div class="card"><div style="display:grid;gap:8px">

function getCohort(){try{return JSON.parse(localStorage.getItem(COHORT))||{}}catch(e){return{}}}
function setCohort(c){try{localStorage.setItem(COHORT,JSON.stringify(c))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}}
function viewCohort(){const c=getCohort();if(S.pid)c[S.pid]=JSON.parse(JSON.stringify(S));
 const rows=Object.values(c).map(s=>summary(s)).sort((a,b)=>a.pid.localeCompare(b.pid));
 const E=rows.filter(r=>r.group==='E');const paired=E.filter(r=>r.seBase!=='-'&&r.sePost!=='-');
 const mb=mean(paired.map(r=>+r.seBase)),mp=mean(paired.map(r=>+r.sePost));
 const sdDiff=(()=>{if(paired.length<2)return null;const d=paired.map(r=>r.sePost-r.seBase),m=mean(d);return Math.sqrt(d.reduce((s,v)=>s+(v-m)**2,0)/(d.length-1))})();
 const t=sdDiff?((mp-mb)/(sdDiff/Math.sqrt(paired.length))):null;
 return `<p class="small ink2">นำเข้ารหัสข้อมูลจากโทรศัพท์ของญาติแต่ละราย ระบบจะรวมเป็นตารางเดียว (ข้อมูลเก็บในเครื่องผู้วิจัยเท่านั้น)</p>
 <div class="card"><label class="f" style="margin-top:0">วางรหัสข้อมูล (PD1.…) ได้ครั้งละหลายรายการ ขึ้นบรรทัดใหม่คั่น</label><textarea id="imp" rows="3" placeholder="PD1.eyJ..."></textarea><button class="btn sm" id="impBtn" style="margin-top:8px">${I('upload',16)} นำเข้า</button></div>
 <div class="statgrid"><div class="stat"><b>${rows.length}</b><span>ผู้เข้าร่วมทั้งหมด (ทดลอง ${E.length})</span></div><div class="stat"><b>${f2(mb)}</b><span>SE ก่อน (n=${paired.length} คู่)</span></div><div class="stat"><b>${f2(mp)}</b><span>SE หลัง สัปดาห์ที่ 4</span></div></div>
 ${t!=null?`<p class="small ink2" style="margin-top:10px">ผลต่างเฉลี่ย ${f2(mp-mb)} (SD ${f2(sdDiff)}), paired t = ${f2(t)}, df = ${paired.length-1} — ใช้สำหรับตรวจสอบกลไกตามทฤษฎีเบื้องต้นเท่านั้น การทดสอบสมมติฐานหลักให้วิเคราะห์ในโปรแกรมสถิติ</p>`:''}
 <h2>ตาราง</h2>
 <div class="tablewrap"><table class="t"><thead><tr><th>รหัส</th><th>กลุ่ม</th><th class="n">SE ก่อน</th><th class="n">SE หลัง</th><th class="n">ฝึก%</th><th class="n">เปิดบท</th><th class="n">วันใช้</th><th class="n">กิจกรรม</th><th class="n">ติดตาม</th><th></th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><b>${esc(r.pid)}</b></td><td>${r.group}</td><td class="n">${r.seBase}</td><td class="n">${r.sePost}</td><td class="n">${r.checklistPct}</td><td class="n">${r.lessonViews}</td><td class="n">${r.appDays}</td><td class="n">${r.acts}/5</td><td class="n">${r.followups}/2</td><td>${r.pid!==S.pid?`<button class="btn sm ghost" data-del="${esc(r.pid)}" style="min-height:30px;padding:2px 8px">ลบ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="10" class="mute">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>
 <div style="display:grid;gap:8px;margin-top:14px"><button class="btn" id="csvAll">${I('copy',18)} คัดลอก CSV สรุปทุกราย</button><button class="btn ghost" id="csvSE">${I('copy',18)} คัดลอก CSV คะแนน SE รายข้อทุกราย</button></div>
 <p class="small mute" style="margin-top:10px">คะแนนความพร้อม (PCS 8 ข้อ) และทักษะ (14 ข้อ) เก็บด้วยแบบสอบถามกระดาษโดยผู้ช่วยวิจัยที่ปกปิดกลุ่ม จึงไม่อยู่ในแอปนี้</p>`}
function csvSERows(list){const head=['pid','group','phase','date',...SE_ITEMS.map((_,k)=>'se'+(k+1)),'mean'];const out=[head.join(',')];
 list.forEach(s=>(s.se||[]).forEach(r=>out.push([s.pid,s.group,r.phase,r.d,...r.scores,f2(mean(r.scores))].join(','))));return out.join('\n')}
function csvSummary(list){const rs=list.map(summary);const k=Object.keys(rs[0]||{pid:1});return [k.join(','),...rs.map(r=>k.map(x=>r[x]).join(','))].join('\n')}
function offerCSV(text,name){
 const m=modal(`<h2 style="margin-top:0">${esc(name)}</h2><code class="blk">${esc(text.slice(0,4000))}${text.length>4000?'…':''}</code><div style="display:grid;gap:8px;margin-top:12px"><button class="btn" id="cp">${I('copy',18)} คัดลอกทั้งหมด</button><button class="btn ghost" id="dl">ดาวน์โหลดไฟล์ (เมื่อโฮสต์เอง)</button></div><p class="small mute">วางลงใน Excel หรือ Google Sheets ได้ทันที</p>`,m=>{
  m.querySelector('#cp').onclick=()=>copyText(text);
  m.querySelector('#dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv'}));a.download=name.replace(/\s+/g,'_')+'.csv';a.click()}catch(e){toast('ดาวน์โหลดไม่ได้ในหน้านี้ ใช้ปุ่มคัดลอกแทน')}}})}

function bindView(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;stopSpeak();render();const t=$('#ltabs');if(t){const y=t.getBoundingClientRect().top+scrollY-70;if(scrollY>y||!b.closest('#ltabs'))window.scrollTo({top:Math.max(0,y)})}else window.scrollTo({top:0})}));
 if(route.startsWith('lesson-')){const l=LESSONS[+route.split('-')[1]],st=L(l.id);
  if(tab==='video'){const vf=$('#vfile');vf&&(vf.onchange=e=>{const f=e.target.files[0];if(!f)return;localVid[l.id]=URL.createObjectURL(f);log('offline_video',l.id);render()});
   document.querySelectorAll('video[data-play]').forEach(v=>v.addEventListener('play',()=>{st.played++;log('video_play',l.id)},{once:true}));

   document.querySelectorAll('[data-ytplay]').forEach(b=>b.onclick=()=>{const id=b.dataset.ytplay,box=b.closest('.ytbox');st.played++;log('yt_play',l.id+':'+id);
    if(ytBlocked||location.protocol==='file:'){ytFallback(box);return}
    box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&hl=th" title="คลิปวิดีโอ" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`})}
  {const o=$('#infoOpen');o&&(o.onclick=()=>{log('info_view',l.id);openInfo(MEDIA[l.id].img,l.title)})}
  document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const k=b.dataset.chk,r=st.check[k];
   if(r?.done){modal(`<h3 style="margin-top:0">ฝึกข้อนี้อีกครั้ง?</h3><p class="small ink2">ฝึกซ้ำช่วยให้คล่องขึ้น เลือกสิ่งที่ต้องการ</p><div style="display:grid;gap:8px"><button class="btn" id="again">ฝึกซ้ำสำเร็จอีก 1 ครั้ง</button><button class="btn ghost" id="undo">ยกเลิกการติ๊ก</button></div>`,m=>{m.querySelector('#again').onclick=()=>{r.times=(r.times||1)+1;r.date=nowISO();log('practice_again',l.id+'.'+k);save();m.remove();toast('เก่งมาก ฝึกซ้ำแล้ว '+r.times+' ครั้ง');render()};m.querySelector('#undo').onclick=()=>{delete st.check[k];save();m.remove();render()}});return}
   st.check[k]={done:true,date:nowISO(),times:1,verified:false};log('practice_done',l.id+'.'+k);save();
   const p=lessonPct(l.id);if(p.pct===100){modal(`<div class="celebrate"><div class="badge">${I('star',48)}</div><h2 style="margin:4px 0">ทำได้ครบทุกข้อแล้ว</h2><p class="ink2">คุณฝึก "${l.title}" สำเร็จด้วยตัวเอง นี่คือหลักฐานว่าคุณดูแลได้จริง</p></div><button class="btn block" id="ok">ประเมินความมั่นใจของบทนี้</button>`,m=>m.querySelector('#ok').onclick=()=>{m.remove();tab='conf';render()})}else toast(['ทำได้ดีมาก','ถูกต้อง เยี่ยมเลย','อีกนิดเดียวก็ครบแล้ว'][p.done%3]);render()});
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{const k=b.dataset.ver;st.check[k]=st.check[k]||{done:true,date:nowISO(),times:1};st.check[k].done=true;st.check[k].verified=!st.check[k].verified;log('verify',l.id+'.'+k);save();render()});
  const cr=$('#cr');if(cr){cr.oninput=()=>{const v=+cr.value;$('#cv').textContent=v;$('#cl').textContent=CONF_LAB[v];cr.style.setProperty('--v',v*10+'%')};
   $('#cs').onclick=()=>{const v=+cr.value;st.conf.push({d:nowISO(),v,w:weekNo()});log('conf',l.id+':'+v);save();render();$('#cfb').innerHTML=confFeedback(v,l);bindAsk();$('#cfb').scrollIntoView({behavior:'smooth',block:'center'})}}
 }
 if(route==='calm'){
  document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{const v=+b.dataset.mood;S.mood.push({d:nowISO(),v});log('mood',v);save();document.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('on',x===b));
   $('#moodMsg').innerHTML=`<p class="small ${v<=1?'':'ink2'}" style="margin:12px 0 0">${v<=1?'ความรู้สึกเครียดหรือกังวลเป็นเรื่องที่เกิดได้กับผู้ดูแลทุกคน ลองฝึกหายใจด้านล่างสักรอบ และเล่าความกังวลให้พยาบาลฟังได้เสมอ':v===2?'ขอบคุณที่บอกความรู้สึก ลองหายใจช้า ๆ สักครู่เพื่อเติมพลังให้ตัวเอง':'ดีใจด้วย ความรู้สึกดีแบบนี้ช่วยให้การดูแลราบรื่น'}</p>`});
  $('#bBtn').onclick=()=>{if(breathOn){breathOn=false;clearTimeout(breathT);$('#bBtn').innerHTML=I('play',18)+' เริ่มฝึก';$('#orbt').innerHTML='หยุดแล้ว';$('#orbc').style.transform='scale(.55)';return}breathOn=true;$('#bBtn').innerHTML=I('pause',18)+' หยุด';runBreath()};
  $('#qadd').onclick=()=>{const t=$('#qtxt').value.trim();if(!t)return;S.questions.push({t,d:nowISO(),done:false});log('question');save();render();toast('บันทึกแล้ว')};
  document.querySelectorAll('[data-qdone]').forEach(b=>b.onclick=()=>{const q=S.questions[+b.dataset.qdone];q.done=!q.done;save();render()});
 }
 if(route==='assess'){
  $('#sePh').onchange=e=>{seDraft.phase=e.target.value};
  document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>{seDraft.scores[+b.dataset.se]=+b.dataset.n;const y=scrollY;render();scrollTo(0,y)});
  $('#seSave').onclick=()=>{const rec={phase:seDraft.phase,d:nowISO(),scores:seDraft.scores.slice()};const replace=seBy(rec.phase);
   const doSave=()=>{S.se=S.se.filter(x=>x.phase!==rec.phase);S.se.push(rec);log('se',rec.phase+':'+f2(mean(rec.scores)));save();seDraft=null;
    modal(`<div class="celebrate"><div class="badge">${I('chart',44)}</div><h2 style="margin:4px 0">บันทึกแล้ว</h2><p class="ink2">ความมั่นใจเฉลี่ยของคุณคือ <b style="font-size:1.4em;color:var(--pri)">${f2(mean(rec.scores))}</b> จาก 10</p><p class="small ink2">ข้อที่มั่นใจน้อยที่สุด: ${SE_ITEMS[rec.scores.indexOf(Math.min(...rec.scores))]}</p></div><button class="btn block" id="ok">ไปทบทวนบทที่เกี่ยวข้อง</button><button class="btn ghost block" id="cl" style="margin-top:8px">ปิด</button>`,m=>{const wk=rec.scores.indexOf(Math.min(...rec.scores));const map=[1,1,2,2,3,4,5,5,0,0,0,0];m.querySelector('#ok').onclick=()=>{m.remove();go('lesson-'+map[wk])};m.querySelector('#cl').onclick=()=>{m.remove();render()}})};
   if(replace)modal(`<h3 style="margin-top:0">มีผลการประเมินช่วงนี้แล้ว</h3><p class="small ink2">ต้องการบันทึกทับผลเดิมหรือไม่</p><button class="btn block" id="y">บันทึกทับ</button><button class="btn ghost block" id="n" style="margin-top:8px">ยกเลิก</button>`,m=>{m.querySelector('#y').onclick=()=>{m.remove();doSave()};m.querySelector('#n').onclick=()=>m.remove()});else doSave()};
 }
 if(route==='plan')document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>{const d=today();S.care[d]=S.care[d]||{};S.care[d][b.dataset.care]=!S.care[d][b.dataset.care];log('care',b.dataset.care);save();render()});
 if(route==='me'){
  $('#tBig').onclick=()=>{S.settings.big=!S.settings.big;save();render()};

  $('#sSave').onclick=()=>{S.settings.phone=$('#sPhone').value.trim();S.settings.ward=$('#sWard').value.trim()||blank().settings.ward;S.settings.sheetUrl=$('#sSheet').value.trim();

   const pin=$('#sPin').value.trim();if(pin){if(!/^\d{4,6}$/.test(pin))return toast('PIN ต้องเป็นตัวเลข 4–6 หลัก');S.settings.pin=pin}save();toast('บันทึกการตั้งค่าแล้ว');render()};
  $('#showCode2').onclick=()=>showCode();
  $('#csv1').onclick=()=>offerCSV(csvSERows([S]),'SE_'+(S.pid||'participant'));
  $('#newP').onclick=()=>modal(`<h3 style="margin-top:0">เริ่มผู้เข้าร่วมรายใหม่</h3><p class="small ink2">ข้อมูลของ ${esc(S.pid)} จะถูกเก็บไว้ในตารางสรุปภาพรวมบนเครื่องนี้ก่อน แล้วล้างหน้าจอสำหรับรายใหม่ การตั้งค่าและ PIN ยังอยู่</p><button class="btn block" id="y">ยืนยัน</button>`,m=>m.querySelector('#y').onclick=()=>{const c=getCohort();if(S.pid)c[S.pid]=JSON.parse(JSON.stringify(S));setCohort(c);const st=S.settings;S=blank();S.settings=st;save();m.remove();researcher=false;viewLesson.seen={};render()});
  $('#wipe').onclick=()=>modal(`<h3 style="margin-top:0;color:var(--warn)">ล้างข้อมูลทั้งหมด?</h3><p class="small ink2">ข้อมูลผู้เข้าร่วม ตารางสรุป และการตั้งค่าในเครื่องนี้จะหายถาวร กรุณาส่งออกรหัสข้อมูลก่อน</p><label class="f">พิมพ์คำว่า ลบ เพื่อยืนยัน</label><input id="cf" type="text"><button class="btn warn block" id="y" style="margin-top:10px">ล้างข้อมูล</button>`,m=>m.querySelector('#y').onclick=()=>{if(m.querySelector('#cf').value.trim()!=='ลบ')return toast('พิมพ์คำว่า ลบ');try{localStorage.removeItem(KEY);localStorage.removeItem(COHORT)}catch(e){}S=blank();researcher=false;m.remove();location.hash='';render()});
 }
 if(route==='res-cohort'){
  $('#impBtn').onclick=()=>{const lines=$('#imp').value.split(/\s+/).filter(x=>x.startsWith('PD1.'));if(!lines.length)return toast('ไม่พบรหัสข้อมูล');const c=getCohort();let n=0;
   lines.forEach(x=>{try{const o=importCode(x);if(o.pid){c[o.pid]=o;n++}}catch(e){}});setCohort(c);toast(`นำเข้าแล้ว ${n} ราย`);render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=getCohort();delete c[b.dataset.del];setCohort(c);render()});
  const all=()=>{const c=getCohort();if(S.pid)c[S.pid]=S;return Object.values(c)};
  $('#csvAll').onclick=()=>offerCSV(csvSummary(all()),'สรุปผู้เข้าร่วม');
  $('#csvSE').onclick=()=>offerCSV(csvSERows(all()),'SE รายข้อ');
 }
}
function bindAsk(){const b=$('#askQ');b&&(b.onclick=()=>go('calm'));document.querySelectorAll('#cfb [data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}
function showCode(){const code=exportCode();modal(`<h2 style="margin-top:0">รหัสข้อมูล ${esc(S.pid)}</h2><p class="small ink2">คัดลอกแล้วส่งให้ผู้วิจัย (เช่น ทาง LINE ของหน่วยงาน) ผู้วิจัยนำไปวางในหน้า "สรุปภาพรวม" รหัสนี้ไม่มีชื่อหรือข้อมูลระบุตัวตน</p><code class="blk">${esc(code)}</code><button class="btn block" id="cp" style="margin-top:12px">${I('copy',18)} คัดลอกรหัส</button><p class="small mute" style="margin:8px 0 0">ขนาด ${(code.length/1024).toFixed(1)} KB</p>`,m=>m.querySelector('#cp').onclick=()=>copyText(code))}

/* start */
if(S.pid&&!location.hash)location.hash='home';
render();
</script>
</body>
</html>
